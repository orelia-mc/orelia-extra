name: OreliaExtra
version: '${version}'
main: rpg.extra.core.OreliaExtraPlugin
api-version: '1.21'
author: rasp1220
description: Orelia later-MMORPG-feature plugin - Party, Guild, Trade, Mail, Auction, Housing, Pet, Mount, Ranking, Achievement
folia-supported: false
depend: [OreliaCore]
softdepend: [OreliaWorld, Vault]

commands:
  rpgextraadmin:
    description: Administrative commands for Orelia Extra
    usage: /rpgextraadmin <reload|...> ...
    permission: orelia.extra.admin
  party:
    description: Manage your party
    usage: /party <create|invite|accept|leave|kick|disband|list>
  guild:
    description: Manage your guild
    usage: /guild <create|invite|accept|leave|kick|promote|demote|disband|info>
  trade:
    description: Trade items with another player
    usage: /trade <player>|accept|add|remove <index>|confirm|cancel|view
  mail:
    description: View and claim your in-game mail
    usage: /mail [unread]
  auction:
    description: Browse, sell on, and buy from the player auction house
    usage: /auction [list|sell <price>|collect]
  house:
    description: Buy a house plot and teleport home
    usage: /house [list|buy <plotId>|home]
  pet:
    description: Buy, summon, and dismiss follower pets
    usage: /pet [list|buy <id>|summon [id]|dismiss]
  mount:
    description: Buy, summon, and dismiss rideable mounts
    usage: /mount [list|buy <id>|summon [id]|dismiss]
  ranking:
    description: Open the level leaderboard
    usage: /ranking
  achievement:
    description: List achievements and completion status
    usage: /achievement

permissions:
  orelia.extra.admin:
    default: op
